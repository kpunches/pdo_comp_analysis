function buildXlsx() {
  const rows = [];
  PROGRAMS.forEach((p) => {
    p.courses.forEach((c) => {
      rows.push({
        "Rank": p.rank,
        "School": p.school,
        "Program Name": p.programName,
        "Program Description": p.description,
        "Program Link": p.url,
        "Composite Score": p.scores.composite,
        "Ranking Avg (45%)": p.scores.rankAvg,
        "Sentiment (40%)": p.scores.sentiment,
        "Freshness (15%)": p.scores.freshness,
        "Sentiment Basis": p.sentimentNote,
        "Credits / Structure": p.credits,
        "Term Model": p.termModel,
        "Seq (Standard Path order)": c.seq,
        "Suggested Term": c.term,
        "Course Code": c.code,
        "Course Title": c.title,
        "Course Description": c.desc,
        "Course Type": c.type,
        "Course Units": c.units,
        "Competencies / Outcomes": c.outcomes,
        "Syllabus / Catalog Link": c.syllabus,
        "Syllabus Source Note": c.syllabusLabel,
        "Sequence Basis": p.sequenceNote,
        "Data Refreshed": p.refreshed,
        "Verification Level": p.verification,
      });
    });
  });
  const wb = XLSX.utils.book_new();
  const ws1 = XLSX.utils.json_to_sheet(rows);
  ws1["!cols"] = [
    { wch: 5 }, { wch: 30 }, { wch: 42 }, { wch: 60 }, { wch: 45 },
    { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 10 }, { wch: 60 },
    { wch: 38 }, { wch: 38 }, { wch: 8 }, { wch: 10 }, { wch: 12 },
    { wch: 55 }, { wch: 65 }, { wch: 14 }, { wch: 12 }, { wch: 55 },
    { wch: 50 }, { wch: 32 }, { wch: 45 }, { wch: 28 }, { wch: 40 },
  ];
  XLSX.utils.book_append_sheet(wb, ws1, "Top 10 Programs");

  const ws2 = XLSX.utils.json_to_sheet(
    SOURCES.map((s) => ({
      "Category": s.category,
      "Source": s.name,
      "URL": s.url,
      "How it was used": s.used,
      "Date accessed": s.accessed,
    }))
  );
  ws2["!cols"] = [{ wch: 28 }, { wch: 55 }, { wch: 55 }, { wch: 90 }, { wch: 14 }];
  XLSX.utils.book_append_sheet(wb, ws2, "Attribution & Sources");
  XLSX.writeFile(wb, "wgu-online-psych-masters-competitive-analysis.xlsx");
}

function ScoreBar({ scores }) {
  const parts = PILLARS.map((p) => ({ ...p, value: scores[p.key], contrib: scores[p.key] * p.weight }));
  const total = parts.reduce((a, b) => a + b.contrib, 0);
  return (
    <div className="w-full">
      <div className="flex h-2 w-full overflow-hidden rounded-sm" style={{ background: "#EDEFF1" }}>
        {parts.map((p) => (
          <div key={p.key} style={{ width: `${(p.contrib / 100) * 100}%`, background: p.color }} title={`${p.label}: ${p.value}/100 × ${p.weight}`} />
        ))}
      </div>
      <div className="mt-1 flex flex-wrap gap-x-4 gap-y-0.5 text-xs" style={{ color: "#5B6672", fontFamily: MONO }}>
        {parts.map((p) => (
          <span key={p.key}>
            <span className="mr-1 inline-block h-2 w-2 rounded-sm align-middle" style={{ background: p.color }} />
            {p.label} {p.value}
          </span>
        ))}
        <span style={{ color: INK }}>Composite {total.toFixed(1)}</span>
      </div>
    </div>
  );
}

function CourseTable({ program }) {
  const th = "px-2 py-1.5 text-left align-bottom font-semibold";
  const td = "px-2 py-1.5 align-top";
  return (
    <div className="overflow-x-auto">
      <table className="w-full border-collapse text-xs" style={{ color: INK, minWidth: 900 }}>
        <thead>
          <tr style={{ borderBottom: `2px solid ${INK}`, color: "#3A4550" }}>
            <th className={th} style={{ fontFamily: MONO, width: 44 }}>Seq</th>
            <th className={th} style={{ fontFamily: MONO, width: 60 }}>Term</th>
            <th className={th} style={{ fontFamily: MONO, width: 84 }}>Code</th>
            <th className={th} style={{ width: 220 }}>Course title</th>
            <th className={th}>Course description</th>
            <th className={th} style={{ width: 88 }}>Type</th>
            <th className={th} style={{ width: 72 }}>Units</th>
            <th className={th} style={{ width: 200 }}>Competencies / outcomes</th>
            <th className={th} style={{ width: 150 }}>Syllabus / catalog</th>
          </tr>
        </thead>
        <tbody>
          {program.courses.map((c, i) => (
            <tr key={i} style={{ borderBottom: `1px solid ${RULE}` }}>
              <td className={td} style={{ fontFamily: MONO }}>{c.seq}</td>
              <td className={td} style={{ fontFamily: MONO }}>{c.term}</td>
              <td className={td} style={{ fontFamily: MONO }}>{c.code}</td>
              <td className={td + " font-medium"}>{c.title}</td>
              <td className={td} style={{ color: "#3A4550" }}>{c.desc}</td>
              <td className={td}>
                <span className="rounded-sm px-1.5 py-0.5" style={{ background: c.type === "Capstone" || c.type === "Track / Capstone" ? "#F3E9DA" : c.type.startsWith("Core") ? "#E7EDF5" : "#EAF4F1", color: "#3A4550" }}>{c.type}</span>
              </td>
              <td className={td} style={{ fontFamily: MONO }}>{c.units}</td>
              <td className={td} style={{ color: "#3A4550" }}>{c.outcomes}</td>
              <td className={td}>
                <a href={c.syllabus} target="_blank" rel="noreferrer" className="underline" style={{ color: TEAL }}>{c.syllabusLabel}</a>
              </td>
            </tr>
          ))}
        </tbody>
      </table>
      <p className="mt-1.5 text-xs italic" style={{ color: "#6B7580" }}>Sequence basis: {program.sequenceNote}</p>
    </div>
  );
}

function ProgramBlock({ program, open, onToggle }) {
  return (
    <section className="mb-5 rounded-md border bg-white" style={{ borderColor: RULE }}>
      <button onClick={onToggle} className="flex w-full items-start gap-4 p-4 text-left focus:outline-none focus-visible:ring-2" style={{ color: INK }} aria-expanded={open}>
        <div className="flex h-11 w-11 shrink-0 items-center justify-center border text-2xl" style={{ borderColor: INK, fontFamily: SERIF }}>{program.rank}</div>
        <div className="min-w-0 flex-1">
          <div className="flex flex-wrap items-baseline gap-x-3">
            <h3 className="text-lg" style={{ fontFamily: SERIF }}>{program.school}</h3>
            <span className="text-xs" style={{ color: "#6B7580", fontFamily: MONO }}>{program.location}</span>
          </div>
          <p className="mt-0.5 text-sm font-semibold" style={{ color: "#2C3A4A" }}>{program.programName}</p>
          <p className="mt-1 text-sm" style={{ color: "#3A4550" }}>{program.description}</p>
          <div className="mt-2 flex flex-wrap gap-x-5 gap-y-1 text-xs" style={{ color: "#5B6672" }}>
            <span><span className="font-semibold" style={{ color: INK }}>Structure:</span> {program.credits}</span>
            <span><span className="font-semibold" style={{ color: INK }}>Terms:</span> {program.termModel}</span>
          </div>
          <div className="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs">
            <a href={program.url} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="underline" style={{ color: TEAL }}>Program page ↗</a>
            <span style={{ color: "#6B7580", fontFamily: MONO }}>Refreshed: {program.refreshed}</span>
            <span style={{ color: AMBER }}>{program.verification}</span>
          </div>
          <div className="mt-3 max-w-xl"><ScoreBar scores={program.scores} /></div>
          <p className="mt-1.5 text-xs" style={{ color: "#5B6672" }}><span className="font-semibold" style={{ color: TEAL }}>Sentiment basis:</span> {program.sentimentNote}</p>
        </div>
        <div className="shrink-0 pt-1 text-sm" style={{ color: "#6B7580" }}>{open ? "− hide courses" : "+ courses"}</div>
      </button>
      {open && (
        <div className="border-t px-4 pb-4 pt-3" style={{ borderColor: RULE }}>
          <CourseTable program={program} />
        </div>
      )}
    </section>
  );
}

function AttributionTab() {
  const h2 = { fontFamily: SERIF, color: INK };
  return (
    <div className="mx-auto max-w-5xl">
      <h2 className="mb-2 text-xl" style={h2}>Methodology — how this top 10 was derived</h2>
      <div className="mb-6 space-y-3 text-sm leading-relaxed" style={{ color: "#2C3A4A" }}>
        <p><span className="font-semibold">Screening.</span> Universe = U.S.-accredited, English-language, fully online (no required campus visits), non-licensure <em>generalist</em> master's in psychology (MA/MS general or general-psychology track). This screen excluded Harvard Extension (Research.com's #1) because it requires an on-campus experience of two weekends or a three-week summer course, and excluded specialized programs (I-O-only, developmental, quantitative, counseling-licensure, human factors, business, and ed-psych degrees).</p>
        <p><span className="font-semibold">Pillar 1 — Ranking-site average (45%).</span> Rank positions and editorial picks were collected from six 2026 ranking publications (OnlineU, Psychology.org, Research.com, Forbes Advisor, AccreditedSchoolsOnline, BestPsychologyDegrees), normalized to a 0–100 scale per site (position percentile for numbered lists; fixed credit for unranked editorial picks), then averaged across every site where the program appears. U.S. News publishes no numbered list for general online psych master's, so it informed brand context only.</p>
        <p><span className="font-semibold">Pillar 2 — Positive sentiment (40%), and how we derived it.</span> Three layers. <span className="font-semibold" style={{ color: TEAL }}>(a) Structured survey sentiment:</span> OnlineU's verified-student recommendation rates (90,000+ surveys) provided a quantitative program-level positive-sentiment score for 6 of the 10 schools (e.g., UOPX 81% on 3,300+ reviews; APUS 79%; Capella 76%). <span className="font-semibold" style={{ color: TEAL }}>(b) Review-corpus valence coding:</span> published review texts (OnlineU reviews dated 2025–2026, GradReports/Niche/Reddit category) were read for course-level and feature-level mentions and coded positive/negative — e.g., FlexPath pacing (+, Capella), advisor support (+, UOPX), slide-heavy assessments (−, one UOPX I-O reviewer), one-course-at-a-time autonomy (+, National). <span className="font-semibold" style={{ color: TEAL }}>(c) Course-popularity proxy:</span> true per-course public review data barely exists for these programs, so "most popular courses" is proxied by curricular convergence — the courses that appear in 8–10 of the 10 curricula (research methods & statistics, lifespan development, social psychology, cognitive psychology, ethics, capstone) are the market's revealed core-demand set, and the ones review texts most often name positively are the methods/stats sequences and applied capstones. Programs without survey rates (ASU, NSU, National, Angelo State) received estimated scores from the qualitative corpus, flagged as such. With production tooling this becomes an aspect-based sentiment pipeline: scrape review corpora → extract course entities → classify valence → volume-normalize → recency-decay.</p>
        <p><span className="font-semibold">Pillar 3 — Freshness (15%), factored into rank as requested.</span> Scored from (i) whether curriculum data was verified live on 2026-07-24 vs. via a dated third-party profile, (ii) ranking-edition dates (all 2026 editions), and (iii) review recency. Every program row carries its own refresh date and verification level.</p>
        <p><span className="font-semibold">Composite.</span> 0.45×RankAvg + 0.40×Sentiment + 0.15×Freshness. Tie at 81.6–81.7 (SNHU vs. NSU) broken by ranking pillar.</p>
        <p><span className="font-semibold">"Standard Path" terminology mapping.</span> WGU's Standard Path (default term-by-term course sequence in the Program Guide) maps to what competitors publish as a <em>recommended course sequence</em> (ASU's exact term), <em>example course sequence</em> (Capella), <em>degree completion plan / DCP</em> (Liberty), <em>degree plan / plan of study</em> (National, Angelo State, Purdue Global), or an individualized <em>iPOS</em> (ASU). Competitor "terms" are 4–10-week sessions rather than WGU's 6-month terms; the Seq/Term columns preserve each school's published or prerequisite-implied order so courses roll up in Standard Path style.</p>
      </div>

      <h2 className="mb-2 text-xl" style={h2}>Attribution — every major source</h2>
      <div className="overflow-x-auto rounded-md border bg-white" style={{ borderColor: RULE }}>
        <table className="w-full border-collapse text-xs" style={{ color: INK, minWidth: 760 }}>
          <thead>
            <tr style={{ borderBottom: `2px solid ${INK}`, color: "#3A4550" }}>
              <th className="px-2 py-2 text-left font-semibold" style={{ width: 160 }}>Category</th>
              <th className="px-2 py-2 text-left font-semibold" style={{ width: 220 }}>Source</th>
              <th className="px-2 py-2 text-left font-semibold">How it was used</th>
              <th className="px-2 py-2 text-left font-semibold" style={{ width: 90, fontFamily: MONO }}>Accessed</th>
            </tr>
          </thead>
          <tbody>
            {SOURCES.map((s, i) => (
              <tr key={i} style={{ borderBottom: `1px solid ${RULE}` }}>
                <td className="px-2 py-2 align-top" style={{ color: "#5B6672" }}>{s.category}</td>
                <td className="px-2 py-2 align-top">
                  <a href={s.url} target="_blank" rel="noreferrer" className="underline" style={{ color: TEAL }}>{s.name}</a>
                </td>
                <td className="px-2 py-2 align-top" style={{ color: "#3A4550" }}>{s.used}</td>
                <td className="px-2 py-2 align-top" style={{ fontFamily: MONO, color: "#5B6672" }}>{s.accessed}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="mt-3 text-xs italic" style={{ color: "#6B7580" }}>
        All course descriptions in this workbook are paraphrased summaries of official catalog language — use the linked pages for exact wording. Programs marked with amber verification notes (UOPX, APUS category rows, Angelo State) should get a direct catalog pull before this analysis is circulated as final.
      </p>
    </div>
  );
}

function CompetitiveAnalysis() {
  const [tab, setTab] = useState("programs");
  const [openSet, setOpenSet] = useState(() => new Set([1, 2, 3]));

  const toggle = (rank) => {
    setOpenSet((prev) => {
      const next = new Set(prev);
      next.has(rank) ? next.delete(rank) : next.add(rank);
      return next;
    });
  };
  const expandAll = () => setOpenSet(new Set(PROGRAMS.map((p) => p.rank)));
  const collapseAll = () => setOpenSet(new Set());

  const tabBtn = (id, label) => (
    <button
      onClick={() => setTab(id)}
      className="border-b-2 px-1 pb-2 text-sm focus:outline-none focus-visible:ring-2"
      style={{
        borderColor: tab === id ? INK : "transparent",
        color: tab === id ? INK : "#6B7580",
        fontFamily: SERIF,
        fontSize: 15,
      }}
    >
      {label}
    </button>
  );

  return (
    <div className="min-h-screen px-4 py-6 sm:px-8" style={{ background: PAPER, color: INK }}>
      <header className="mx-auto mb-6 max-w-6xl">
        <p className="text-xs uppercase tracking-widest" style={{ color: "#6B7580", fontFamily: MONO }}>WGU · EPD competitive analysis · refreshed {REFRESH_DEFAULT}</p>
        <div className="mt-1 flex flex-wrap items-end justify-between gap-3">
          <h1 className="text-2xl sm:text-3xl" style={{ fontFamily: SERIF }}>
            Online-Only Generalist Master's in Psychology — Top 10
          </h1>
          <button
            onClick={buildXlsx}
            className="rounded-md px-4 py-2 text-sm font-semibold text-white focus:outline-none focus-visible:ring-2"
            style={{ background: TEAL }}
          >
            Download .xlsx (both tabs)
          </button>
        </div>
        <p className="mt-2 max-w-4xl text-sm" style={{ color: "#3A4550" }}>
          Order = 45% ranking-site average + 40% positive sentiment + 15% data freshness. Fully online, English, non-licensure generalist programs only — Harvard Extension excluded for its on-campus requirement (see Attribution tab). Courses roll up under each program in Standard Path order (each school's published recommended course sequence, or prerequisite-implied order where none is published).
        </p>
      </header>

      <nav className="mx-auto mb-5 flex max-w-6xl gap-6 border-b" style={{ borderColor: RULE }}>
        {tabBtn("programs", "Tab 1 — Top 10 programs & courses")}
        {tabBtn("attribution", "Tab 2 — Attribution & methodology")}
      </nav>

      <main className="mx-auto max-w-6xl">
        {tab === "programs" ? (
          <>
            <div className="mb-4 flex flex-wrap items-center gap-3 text-xs" style={{ color: "#5B6672" }}>
              <button onClick={expandAll} className="underline focus:outline-none focus-visible:ring-2" style={{ color: TEAL }}>Expand all courses</button>
              <button onClick={collapseAll} className="underline focus:outline-none focus-visible:ring-2" style={{ color: TEAL }}>Collapse all</button>
              <span style={{ fontFamily: MONO }}>Score bar segments = weighted pillar contributions (indigo ranking · teal sentiment · amber freshness)</span>
            </div>
            {PROGRAMS.map((p) => (
              <ProgramBlock key={p.rank} program={p} open={openSet.has(p.rank)} onToggle={() => toggle(p.rank)} />
            ))}
            <p className="mb-8 text-xs italic" style={{ color: "#6B7580" }}>
              Nearest generalist misses (single-list presence): Roosevelt University MA General Psychology (71.4) and University of Louisiana Monroe MS Psychology (70.5). Full exclusion log on the Attribution tab.
            </p>
          </>
        ) : (
          <AttributionTab />
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<CompetitiveAnalysis />);

  </script>
</body>
</html>
